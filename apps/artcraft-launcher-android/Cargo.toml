[package]
name = "artcraft-launcher-android"
description = "ArtCraft Launcher for Android: the shared egui interface in a NativeActivity, with the system package installer behind it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "artcraft_launcher_android"
crate-type = ["cdylib", "rlib"]

# The one place in the workspace that needs `unsafe`: Android hands native code raw JNI pointers
# (`JavaVM`, the activity), and the Rust JNI wrappers take them only through `unsafe` constructors.
# Everything else keeps `unsafe_code = "forbid"`; here it is `deny`, and only `jni_bridge.rs` and
# the `android_main` entry point allow it, each at one named site. See AGENTS.md section 2.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_os = "android")'.dependencies]
artcraft-launcher-core = { workspace = true }
artcraft-launcher-ui-egui = { workspace = true }
artcraft-launcher-native = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity", "links"] }
egui = { workspace = true }
log = { workspace = true }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.21"
