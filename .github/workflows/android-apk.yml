# Builds the Android APK of ArtCraft Launcher. For a fork: Actions → "Android APK" → Run workflow.
# With "Publish" ticked (the default) the APK is also published as a release of this fork.
# (Upstream CI is shared; this file isn't part of that.)
name: Android APK
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a release of this fork"
        type: boolean
        default: true
  push:
    tags: ["android-v*"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Install Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Build
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: artcraft-launcher-android-arm64
          path: android/build/artcraft-launcher-*-android-arm64.apk
      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          cd android/build
          apk="artcraft-launcher-$version-android-arm64.apk"
          sha256sum "$apk" > SHA256SUMS.txt
          gh release create "v$version" "$apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --title "ArtCraft Launcher $version (Android)" --notes "Android build of ArtCraft Launcher $version." \
            || gh release upload "v$version" "$apk" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
